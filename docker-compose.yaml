services:
  db:
    image: postgres:16-alpine
    container_name: hireme-db
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_dev_pw
      POSTGRES_DB: hireme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d hireme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
